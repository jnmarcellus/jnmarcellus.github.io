<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Without this the attribution rendered as "Â© OpenStreetMap". -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXRAD radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body { height: 100%; margin: 0; }
    /* Was a hardcoded 600px inside a 280px frame, so the bottom half of the
       radar was cropped off and scrolling="no" hid the evidence. */
    #mapid { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="mapid"></div>
  <script>
    var map = L.map('mapid').setView([32.4676, -97.5164], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi', {
      layers: 'nexrad-n0r-900913',
      format: 'image/png',
      transparent: true,
      opacity: 0.5,
      attribution: 'Radar © Iowa Environmental Mesonet'
    }).addTo(map);
  </script>
</body>
</html>
