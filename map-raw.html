<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Without this the attribution rendered as "Â© OpenStreetMap". -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXRAD radar</title>
  <!-- Leaflet 1.9.4, vendored in vendor/leaflet/ (BSD-2-Clause, see LICENSE
       there). Byte-identical to the unpkg build it replaces — verified
       against the SRI hashes that used to be pinned here. No integrity or
       crossorigin attributes now: SRI is for resources you do not control,
       and crossorigin on a same-origin fetch just breaks it. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    /* Was a hardcoded 600px inside a 280px frame, so the bottom half of the
       radar was cropped off and scrolling="no" hid the evidence. */
    #mapid { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="mapid"></div>
  <script>
    var map = L.map('mapid').setView([32.4676, -97.5164], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi', {
      layers: 'nexrad-n0r-900913',
      format: 'image/png',
      transparent: true,
      opacity: 0.5,
      attribution: 'Radar © Iowa Environmental Mesonet'
    }).addTo(map);
  </script>
</body>
</html>
