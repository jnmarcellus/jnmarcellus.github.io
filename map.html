<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live NEXRAD weather radar over OpenStreetMap.">
    <meta name="theme-color" content="#1C1C1C">
    <title>Radar · Quest</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preload" href="fonts/fira-code-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/main.css">
    <script>window.BASE='';try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <main>
        <header>
            <section id="date-time" aria-label="Date and time"></section>
            <section id="weather" aria-label="Location and weather"></section>
        </header>
        <section id="traichu">
            <h1 class="sr-only">Radar</h1>
            <aside id="logo"></aside>
            <div class="banner" id="banner-container"></div>
            <nav id="dock" aria-label="Applications"></nav>
            <section id="search" aria-label="Search">
                <form id="search-form" autocomplete="off">
                    <input type="search" id="search-query" name="q"
                           autocomplete="off" spellcheck="false" enterkeyhint="search"
                           aria-label="Search the web">
                    <span id="search-engine" aria-hidden="true"></span>
                    <button type="submit" class="sr-only" tabindex="-1">Search</button>
                </form>
            </section>
            <section id="maps">
                <div class="iframe-container">
                    <iframe src="./map-raw.html" title="Weather radar" loading="lazy"></iframe>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
